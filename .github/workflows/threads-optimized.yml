name: Threads Optimized Posting (Day-of-Week Strategy)

on:
  # 曜日別最適化スケジュール（1日10投稿）
  # 戦略: 曜日×時間帯の組み合わせで反応率を最大化
  schedule:
    # === 月曜（新ノウハウ系が強い朝重視）===
    - cron: '0 22 * * 0'    # 月曜 7:00 JST
    - cron: '0 23 * * 0'    # 月曜 8:00 JST
    - cron: '0 0 * * 1'     # 月曜 9:00 JST
    - cron: '30 1 * * 1'    # 月曜 10:30 JST
    - cron: '0 2 * * 1'     # 月曜 11:00 JST
    - cron: '0 7 * * 1'     # 月曜 16:00 JST
    - cron: '0 8 * * 1'     # 月曜 17:00 JST
    - cron: '30 9 * * 1'    # 月曜 18:30 JST
    - cron: '0 10 * * 1'    # 月曜 19:00 JST
    - cron: '0 11 * * 1'    # 月曜 20:00 JST

    # === 火曜（問題解決系、昼12-15時を避ける）===
    - cron: '0 23 * * 1'    # 火曜 8:00 JST
    - cron: '0 0 * * 2'     # 火曜 9:00 JST
    - cron: '0 1 * * 2'     # 火曜 10:00 JST
    - cron: '0 2 * * 2'     # 火曜 11:00 JST
    - cron: '0 7 * * 2'     # 火曜 16:00 JST
    - cron: '0 8 * * 2'     # 火曜 17:00 JST
    - cron: '0 9 * * 2'     # 火曜 18:00 JST
    - cron: '0 10 * * 2'    # 火曜 19:00 JST
    - cron: '0 11 * * 2'    # 火曜 20:00 JST
    - cron: '0 12 * * 2'    # 火曜 21:00 JST

    # === 水曜（問題解決系、昼12-15時を避ける）===
    - cron: '0 23 * * 2'    # 水曜 8:00 JST
    - cron: '0 0 * * 3'     # 水曜 9:00 JST
    - cron: '0 1 * * 3'     # 水曜 10:00 JST
    - cron: '0 2 * * 3'     # 水曜 11:00 JST
    - cron: '0 7 * * 3'     # 水曜 16:00 JST
    - cron: '0 8 * * 3'     # 水曜 17:00 JST
    - cron: '0 9 * * 3'     # 水曜 18:00 JST
    - cron: '0 10 * * 3'    # 水曜 19:00 JST
    - cron: '0 11 * * 3'    # 水曜 20:00 JST
    - cron: '0 12 * * 3'    # 水曜 21:00 JST

    # === 木曜（問題解決系、昼12-15時を避ける）===
    - cron: '0 23 * * 3'    # 木曜 8:00 JST
    - cron: '0 0 * * 4'     # 木曜 9:00 JST
    - cron: '0 1 * * 4'     # 木曜 10:00 JST
    - cron: '0 2 * * 4'     # 木曜 11:00 JST
    - cron: '0 7 * * 4'     # 木曜 16:00 JST
    - cron: '0 8 * * 4'     # 木曜 17:00 JST
    - cron: '0 9 * * 4'     # 木曜 18:00 JST
    - cron: '0 10 * * 4'    # 木曜 19:00 JST
    - cron: '0 11 * * 4'    # 木曜 20:00 JST
    - cron: '0 12 * * 4'    # 木曜 21:00 JST

    # === 金曜（週末実践系、夜重視）===
    - cron: '0 23 * * 4'    # 金曜 8:00 JST
    - cron: '0 0 * * 5'     # 金曜 9:00 JST
    - cron: '0 1 * * 5'     # 金曜 10:00 JST
    - cron: '0 7 * * 5'     # 金曜 16:00 JST
    - cron: '0 8 * * 5'     # 金曜 17:00 JST
    - cron: '0 9 * * 5'     # 金曜 18:00 JST
    - cron: '0 10 * * 5'    # 金曜 19:00 JST
    - cron: '0 11 * * 5'    # 金曜 20:00 JST
    - cron: '0 12 * * 5'    # 金曜 21:00 JST
    - cron: '0 13 * * 5'    # 金曜 22:00 JST

    # === 土曜（長文体験談系、滞在時間が長い夜重視）===
    - cron: '0 1 * * 6'     # 土曜 10:00 JST
    - cron: '0 2 * * 6'     # 土曜 11:00 JST
    - cron: '0 3 * * 6'     # 土曜 12:00 JST
    - cron: '0 5 * * 6'     # 土曜 14:00 JST
    - cron: '0 6 * * 6'     # 土曜 15:00 JST
    - cron: '0 7 * * 6'     # 土曜 16:00 JST
    - cron: '0 9 * * 6'     # 土曜 18:00 JST
    - cron: '0 10 * * 6'    # 土曜 19:00 JST
    - cron: '0 11 * * 6'    # 土曜 20:00 JST
    - cron: '0 12 * * 6'    # 土曜 21:00 JST

    # === 日曜（夜20時以降を避ける、サザエさん症候群対策）===
    - cron: '0 1 * * 0'     # 日曜 10:00 JST
    - cron: '0 2 * * 0'     # 日曜 11:00 JST
    - cron: '0 3 * * 0'     # 日曜 12:00 JST
    - cron: '0 5 * * 0'     # 日曜 14:00 JST
    - cron: '0 6 * * 0'     # 日曜 15:00 JST
    - cron: '0 7 * * 0'     # 日曜 16:00 JST
    - cron: '0 8 * * 0'     # 日曜 17:00 JST
    - cron: '0 9 * * 0'     # 日曜 18:00 JST
    - cron: '0 10 * * 0'    # 日曜 19:00 JST
    - cron: '30 10 * * 0'   # 日曜 19:30 JST

  # 手動実行
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python環境をセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 依存関係をインストール
        run: pip install requests python-dotenv

      - name: 曜日別最適化投稿スクリプトを実行
        run: python3 threads_simple.py
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
